name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar build para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4