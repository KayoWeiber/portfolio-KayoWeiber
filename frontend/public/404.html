<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kayo Weiber - Desenvolvedor Full Stack</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages: redireciona a URL real para
    // index.html via query string, preservando path/hash para o React Router.
    var pathSegmentsToKeep = 0;
    var location = window.location;

    location.replace(
      location.protocol + "//" + location.hostname + (location.port ? ":" + location.port : "") +
      location.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      location.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") +
      location.hash
    );
  </script>
</head>

<body>
</body>

</html>
